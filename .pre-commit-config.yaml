# Local pre-commit hooks. Install with:
# $ pip install pre-commit && pre-commit install
# Manual trigger:
# $ pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: ./build-aux/checks.sh cargo_fmt
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: ./build-aux/checks.sh cargo_clippy
        language: system
        types: [rust]
        pass_filenames: false
      - id: potfiles
        name: regenerate po/POTFILES.in when translatable files change
        entry: ./build-aux/checks.sh potfiles
        language: system
        files: ^(src/.*\.(rs|ui)|data/.*\.(ui|desktop\.in|metainfo\.xml\.in))$
        pass_filenames: false
      - id: cargo-sources-fresh
        name: regenerate cargo-sources.json when Cargo.lock changes
        entry: ./scripts/update-cargo-sources.sh
        language: system
        files: ^Cargo\.lock$
        pass_filenames: false
