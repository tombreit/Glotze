name: Nix

# Verifies the flake keeps building. Nix users consume Glotze straight from the
# flake ref (`nix run github:tombreit/Glotze`), so there's no artifact to ship
# here — the GitHub release is produced by flatpak.yml. Neither tags nor
# cargo release's "Release x.y.z" commits are built: they only bump the version
# of a commit main already built.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: nix build
    # Skip cargo release's version-bump commit (see pre-release-commit-message
    # in Cargo.toml). PRs and manual runs have no head_commit and always build.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release ') }}
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Build package
        run: nix build --print-build-logs
