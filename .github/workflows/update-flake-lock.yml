name: Update flake.lock

# Keeps flake.lock (the nixpkgs pin behind the Nix build) current, independently
# of app releases. Runs monthly and on demand; commits the updated flake.lock
# directly to the branch only when nixpkgs has actually moved (idempotent —
# no change, no commit). The "Run workflow" button in the Actions tab replaces
# any local/ad-hoc regeneration.

on:
  schedule:
    - cron: '0 4 1 * *' # 1st of each month, 04:00 UTC
  workflow_dispatch: # manual "regenerate now" button

permissions:
  contents: write

jobs:
  update:
    name: nix flake update
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update flake.lock
        run: nix flake update

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --staged --quiet; then
            echo "flake.lock is already up to date — nothing to commit."
          else
            git commit -m "chore: update flake.lock (nixpkgs bump)"
            git push
          fi
