name: Lint and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: fmt + potfiles + packaging
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: ./build-aux/checks.sh cargo_fmt
      - run: ./build-aux/checks.sh potfiles
      - run: ./build-aux/checks.sh runtime_version
      # The offline Flatpak build only sees crates vendored via
      # cargo-sources.json; fail here, fast, if it lags behind Cargo.lock.
      - run: ./build-aux/checks.sh cargo_sources

  clippy-and-test:
    name: clippy + test
    runs-on: ubuntu-26.04
    # Fedora latest ships GTK 4 + libadwaita 1.8 (≥ our 1.7 minimum) in dnf,
    # and rustup gives us current-stable Rust regardless of distro version.
    # tzdata: the date-formatting tests need Europe/Berlin.
    # The gnome-SDK container that flatpak.yml uses doesn't have rustup on
    # PATH, so we use a plain Fedora here.
    container:
      image: fedora:latest
    steps:
      - name: Install system build deps
        run: |
          dnf install -y --setopt=install_weak_deps=False --best \
            gtk4-devel libadwaita-devel pkgconf-pkg-config \
            gcc git ca-certificates tzdata
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: cargo clippy
        run: ./build-aux/checks.sh cargo_clippy
      - name: cargo test
        run: ./build-aux/checks.sh cargo_test
