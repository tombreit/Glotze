name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Cancel stale PR and main builds. Tag builds always run to completion so
# release artifacts aren't accidentally dropped.
concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: flatpak-builder
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out
        uses: actions/checkout@v6

      # Flathub's own linter (bundled in the flathub-infra image). Catches
      # manifest/permission problems before the slow build. checks.sh adds
      # --gha-format under GitHub Actions, turning findings into PR annotations.
      - name: Lint manifest
        run: ./build-aux/checks.sh manifest

      # Ref: https://github.com/flatpak/flatpak-github-actions
      - name: Build flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: glotze.flatpak
          manifest-path: build-aux/io.github.tombreit.Glotze.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'build-aux/io.github.tombreit.Glotze.yml') }}
          # Pinned to `stable` so the locally produced bundle's ref matches Flathub's `stable` branch.
          branch: stable
          # Ref: https://docs.flatpak.org/en/latest/flatpak-builder-command-reference.html
          mirror-screenshots-url: https://dl.flathub.org/media
          run-tests: true

      # Lint the built OSTree repo (the same check Flathub runs on submission).
      - name: Lint repo
        run: ./build-aux/checks.sh repo

      # Decide whether this run cuts a release, and at which tag.
      #   * tag push (manual escape hatch) -> release at that tag.
      #   * push to main -> derive v<version> from Cargo.toml (the single source
      #     of truth, same line meson reads). If that tag doesn't exist yet,
      #     create and push it, then release. Bumping Cargo.toml is the only
      #     manual step; no hand-tagging, no version duplicated across files.
      # The tag is pushed with the default GITHUB_TOKEN, which deliberately does
      # not re-trigger this workflow — we already hold the freshly built bundle,
      # so we attach it here in the same run instead of chaining.
      - name: Resolve release tag
        id: rel
        if: github.event_name == 'push'
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^version = //p' Cargo.toml | head -n1 | tr -d '"')
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; no release this run."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag"
            git push origin "$tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # TODO: Evaluate https://github.com/step-security/action-gh-release as an alternative
      - name: Attach bundle to GitHub release
        if: steps.rel.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          files: glotze.flatpak
          generate_release_notes: true
          fail_on_unmatched_files: true
