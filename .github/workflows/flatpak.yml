name: Flatpak

# Builds the Flatpak on every push and PR. On a v* tag (cargo release pushes
# one) that same build is also GPG-signed and published: the bundle is attached
# to the GitHub release, and the OSTree repo is deployed to GitHub Pages
# (https://tombreit.github.io/Glotze/). One build, so the bundle and the repo
# always contain identical binaries.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel stale PR and main builds. Tag builds always run to completion so
# release artifacts aren't accidentally dropped.
concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: flatpak-builder
    # cargo release pushes its "Release x.y.z" commit to main together with the
    # v* tag; the tag run builds (and publishes) that exact commit, so skip the
    # duplicate main build. Keep in sync with pre-release-commit-message in
    # Cargo.toml. PRs and manual runs have no head_commit and always build.
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    container:
      # The gnome-NN tag must match runtime-version in the manifest;
      # `build-aux/checks.sh runtime_version` (run by lint.yml) enforces it.
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out
        uses: actions/checkout@v6

      # Flathub's own linter (bundled in the flathub-infra image). Catches
      # manifest/permission problems before the slow build. checks.sh adds
      # --gha-format under GitHub Actions, turning findings into PR annotations.
      - name: Lint manifest
        run: ./build-aux/checks.sh manifest

      - name: Import signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          GNUPGHOME="$(mktemp -d)"
          echo "$FLATPAK_GPG_PRIVATE_KEY" | base64 -d | gpg --homedir "$GNUPGHOME" --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      # Ref: https://github.com/flatpak/flatpak-github-actions
      # Builds the OSTree repo in ./repo, exports glotze.flatpak from it and
      # uploads that as a workflow artifact. Only tag builds are signed; an
      # empty gpg-sign skips signing. Screenshots are deliberately not mirrored:
      # --mirror-screenshots-url would point them at dl.flathub.org, which only
      # hosts screenshots of apps published on Flathub.
      - name: Build
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: glotze.flatpak
          manifest-path: build-aux/io.github.tombreit.Glotze.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'build-aux/io.github.tombreit.Glotze.yml') }}
          # Must match website/Glotze.flatpakref (Branch=stable), so the
          # bundle and the repo both carry Flathub's `stable` branch name.
          branch: stable
          gpg-sign: ${{ startsWith(github.ref, 'refs/tags/') && secrets.FLATPAK_GPG_KEY_ID || '' }}
          run-tests: true

      - name: Sign repo summary and generate static deltas
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          flatpak build-update-repo --generate-static-deltas \
            --gpg-sign="$KEY_ID" --gpg-homedir="$GNUPGHOME" repo

      # Lint the built OSTree repo (the same check Flathub runs on submission).
      - name: Lint repo
        run: ./build-aux/checks.sh repo

      # website/ is the site root; -L turns its symlinks (app icon,
      # screenshots) into real files.
      - name: Assemble Pages site
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p public
          cp -rL website/. public/
          mv repo public/repo

      - name: Upload Pages artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The builder action uploads the bundle as artifact
      # "<bundle stem>-<arch>.flatpak", containing glotze.flatpak. Fetching it
      # by exact name also fails loudly if it's missing (a pattern that
      # matches nothing just downloads zero files).
      - name: Download bundle
        uses: actions/download-artifact@v8
        with:
          name: glotze-x86_64.flatpak

      # `--notes` is prepended to the auto-generated notes, giving every release
      # install instructions up top. The Nix path has no file artifact — its
      # "artifact" is this tag, which the flake ref resolves reproducibly.
      # A re-run only replaces the bundle on the existing release.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(cat <<'EOF'
          ### Install this release

          **Flatpak - via repository**
          ```bash
          # Only once: add the remote repo
          flatpak install https://tombreit.github.io/Glotze/Glotze.flatpakref

          # Later:
          flatpak update io.github.tombreit.Glotze
          flatpak run io.github.tombreit.Glotze
          ```

          **Flatpak via download**
          ```sh
          flatpak install --user ./glotze.flatpak
          flatpak run io.github.tombreit.Glotze
          ```

          **Nix / flake** — no download needed; run this exact version:
          ```sh
          nix run github:tombreit/Glotze/__TAG__
          ```
          EOF
          )
          gh release create "$TAG" glotze.flatpak --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --notes "${notes//__TAG__/$TAG}" \
            || gh release upload "$TAG" glotze.flatpak --repo "$GITHUB_REPOSITORY" --clobber

  deploy-pages:
    name: Deploy to Pages
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
