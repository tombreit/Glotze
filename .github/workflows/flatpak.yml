name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Cancel stale PR and main builds. Tag builds always run to completion so
# release artifacts aren't accidentally dropped.
concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: flatpak-builder
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out
        uses: actions/checkout@v6

      # Flathub's own linter (bundled in the flathub-infra image). Catches
      # manifest/permission problems before the slow build. checks.sh adds
      # --gha-format under GitHub Actions, turning findings into PR annotations.
      - name: Lint manifest
        run: ./build-aux/checks.sh manifest

      # Ref: https://github.com/flatpak/flatpak-github-actions
      - name: Build flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: glotze.flatpak
          manifest-path: build-aux/io.github.tombreit.Glotze.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'build-aux/io.github.tombreit.Glotze.yml') }}
          # Pinned to `stable` so the locally produced bundle's ref matches Flathub's `stable` branch.
          branch: stable
          # Ref: https://docs.flatpak.org/en/latest/flatpak-builder-command-reference.html
          mirror-screenshots-url: https://dl.flathub.org/media
          run-tests: true

      # Lint the built OSTree repo (the same check Flathub runs on submission).
      - name: Lint repo
        run: ./build-aux/checks.sh repo

      # TODO: Evaluate https://github.com/step-security/action-gh-release as an alternative
      - name: Attach bundle to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: glotze.flatpak
          generate_release_notes: true
          fail_on_unmatched_files: true
