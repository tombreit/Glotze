name: Pages

# Builds a GPG-signed Flatpak repository and publishes it to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build signed repo
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Import signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          GNUPGHOME="$(mktemp -d)"
          echo "$FLATPAK_GPG_PRIVATE_KEY" | base64 -d | gpg --homedir "$GNUPGHOME" --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      # Reuse the proven action from flatpak.yml: it sets up the flathub
      # remote and installs SDK/runtime deps correctly inside the container.
      # gpg-sign uses the GNUPGHOME imported above (exported to $GITHUB_ENV).
      - name: Build and sign the OSTree repo
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: build-aux/io.github.tombreit.Glotze.yml
          # Must match distribution/Glotze.flatpakref (Branch=stable) and flatpak.yml.
          branch: stable
          gpg-sign: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          mirror-screenshots-url: https://dl.flathub.org/media
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'build-aux/io.github.tombreit.Glotze.yml') }}
          # We publish the repo dir, not a single-file bundle.
          build-bundle: false
          upload-artifact: false

      - name: Generate static deltas and refresh repo metadata
        env:
          KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          flatpak build-update-repo --generate-static-deltas \
            --gpg-sign="$KEY_ID" --gpg-homedir="$GNUPGHOME" repo

      # Lint the built OSTree repo, same as flatpak.yml and the local dry run.
      - name: Lint repo
        run: ./build-aux/checks.sh repo

      - name: Assemble Pages site
        run: |
          mkdir -p public
          cp -r distribution/. public/
          mv repo public/repo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
